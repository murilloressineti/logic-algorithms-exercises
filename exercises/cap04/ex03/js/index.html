<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parquímetro</title>
    <!--
    Enunciado do exercício:
    Elaborar um programa para simular um parquímetro, o qual leia o valor de moedas depositado em um terminal de estacionamento rotativo. O programa deve informar o tempo de permanência do veículo no local e o troco (se existir). Se o valor for inferior ao tempo mínimo, exiba a mensagem: "Valor Insuficiente". Considerar os valores/tempos da Tabela. (o máximo é 120 min)

    Tabela – Valores do Parquímetro
    Valor R$  Tempo (min)
    1,00      30
    1,75      60
    3,00      120
  --></head>
  <body>
    <h1>Programa Parquímetro</h1>

    <form>
      <label for="price">Valor R$:</label>
      <input type="text" name="price" id="price" /> <br />

      <input type="submit" value="Confirmar Depósito" />
    </form>

    <h3 id="result"></h3>

    <script>
      const form = document.querySelector("form");
      const result = document.getElementById("result");

      function convertToNumber(value) {
        value = value.trim();

        value = value.replace(",", ".");

        return Number(value);
      }

      function convertBRL(value) {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(value);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const price = convertToNumber(form.price.value);

        if (isNaN(price) || price <= 0) {
          result.innerHTML = "Valor inválido.";
          return;
        }

        if (price < 1) {
          result.innerHTML = `Valor Insuficiente, mínimo de R$1,00 para 30 minutos.`;
        } else if (price >= 1 && price < 1.75) {
          result.innerHTML = `Tempo: 30 min. Troco: ${convertBRL(price - 1)}`;
        } else if (price >= 1.75 && price < 3) {
          result.innerHTML = `Tempo: 60 min. Troco: ${convertBRL(
            price - 1.75
          )}`;
        } else {
          result.innerHTML = `Tempo: 120 min. Troco: ${convertBRL(price - 3)}`;
        }
      });
    </script>
  </body>
</html>
