<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parquímetro</title>

    <style type="text/tailwindcss">
      @theme {
        --color-primary: #cbdcf7;
        --color-card: #f2f6f9;

        --color-button: #1d77c2;
        --color-button-hover: #135b96;
      }
    </style>
  </head>
  <!--
    Enunciado do exercício:
    Elaborar um programa para simular um parquímetro, o qual leia o valor de moedas depositado em um terminal de estacionamento rotativo. O programa deve informar o tempo de permanência do veículo no local e o troco (se existir). Se o valor for inferior ao tempo mínimo, exiba a mensagem: "Valor Insuficiente". Considerar os valores/tempos da Tabela. (o máximo é 120 min)

    Tabela – Valores do Parquímetro
    Valor R$  Tempo (min)
    1,00      30
    1,75      60
    3,00      120
  -->
  <body>
    <div id="root">
      <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <script type="text/babel">
        function Header() {
          return (
            <div className=" flex flex-col items-center justify-center bg-gradient-to-r from-blue-500 to-blue-400 rounded-2xl p-8">
              <h1 className="font-bold uppercase text-white text-3xl">
                Parquímetro
              </h1>
              <span className="text-6xl mt-5">🪙</span>
            </div>
          );
        }

        function Card() {
          const [priceValue, setPriceValue] = React.useState("");
          const [result, setResult] = React.useState("0");
          const [change, setChange] = React.useState("R$ 0,00");

          function convertToNumber(value) {
            value = value.trim();
            value = value.replace(",", ".");
            return Number(value);
          }

          function convertBRL(value) {
            return new Intl.NumberFormat("pt-BR", {
              style: "currency",
              currency: "BRL",
            }).format(value);
          }

          function handleSubmit(e) {
            e.preventDefault();

            const price = convertToNumber(priceValue);

            if (isNaN(price) || price <= 0) {
              alert("Valor inválido.");
              return;
            }

            if (price < 1) {
              alert(`Valor Insuficiente, mínimo de R$1,00 para 30 minutos.`);
            } else if (price >= 1 && price < 1.75) {
              setResult("30");
              setChange(`${convertBRL(price - 1)}`);
            } else if (price >= 1.75 && price < 3) {
              setResult("60");
              setChange(`${convertBRL(price - 1.75)}`);
            } else {
              setResult("120");
              setChange(`${convertBRL(price - 3)}`);
            }
          }

          return (
            <div className="p-8 flex justify-center gap-2">
              <form onSubmit={handleSubmit} className="flex flex-col gap-8">
                <div className="flex flex-col gap-2">
                  <label
                    htmlFor="price"
                    className="text-gray-500 text-sm font-semibold"
                  >
                    Valor Depositado (R$)
                  </label>
                  <input
                    type="text"
                    name="price"
                    id="price"
                    className="border border-gray-400 rounded-md bg-white p-1.5 font-semibold text-gray-600"
                    value={priceValue}
                    onChange={(e) => setPriceValue(e.target.value)}
                  />
                </div>

                <input
                  type="submit"
                  value="Confirmar"
                  className="py-2 px-8 rounded-full text-white font-semibold uppercase cursor-pointer 
                  bg-gradient-to-r from-blue-500 to-blue-400 bg-[length:200%_200%]
                  transition-all duration-300 hover:bg-[position:100%_0%]
                  "
                />
              </form>

              <div className="border border-gray-200 mx-4"></div>

              <div id="result">
                <div className="flex flex-col gap-1">
                  <h3 className="text-sm font-semibold text-gray-500">
                    Tempo de Permanência
                  </h3>
                  <p className="uppercase font-bold text-2xl">
                    {result} minutos
                  </p>
                  <p className="uppercase font-semibold text-sm text-gray-500">
                    Troco: {change}
                  </p>
                </div>

                <div className="border border-gray-200 my-8"></div>

                <div className="mb-2">
                  <h4 className="text-sm font-semibold text-gray-700 mb-2">
                    Tabela de Valores
                  </h4>

                  <table className="w-full border-collapse">
                    <tbody>
                      <tr className="bg-gray-200 border border-gray-300 rounded-t-md">
                        <td className="font-semibold text-sm text-gray-500 py-1 px-2">
                          R$1,00 - 30 min
                        </td>
                      </tr>
                      <tr className="bg-gray-200 border border-gray-300">
                        <td className="font-semibold text-sm text-gray-500 py-1 px-2">
                          R$1,75 - 60 min
                        </td>
                      </tr>
                      <tr className="bg-gray-200 border border-gray-300 rounded-b-md">
                        <td className="font-semibold text-sm text-gray-500 py-1 px-2">
                          R$3,00 - 120 min
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <span className="font-semibold text-sm text-gray-500">
                  Tempo máximo: 120 min.
                </span>
              </div>
            </div>
          );
        }

        function App() {
          return (
            <main className="min-h-screen flex items-center justify-center bg-primary">
              <div className="bg-card rounded-2xl w-124">
                <Header />
                <Card />
              </div>
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      </script>
    </div>
  </body>
</html>
