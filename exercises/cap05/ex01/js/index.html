<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repete Fruta</title>
  </head>
  <!--
    Enunciado do exercício:
    Elaborar um programa que leia o nome de uma fruta e um número. O programa deve repetir a exibição do nome da fruta, de acordo com o número informado. Utilize o *** para separar os nomes.
  -->
  <body>
    <h1>Programa Repete Fruta</h1>

    <form>
      <label for="fruit">Fruta:</label>
      <input type="text" name="fruit" id="fruit" /> <br />

      <label for="number">Número:</label>
      <input type="text" name="number" id="number" /> <br />

      <input type="submit" value="Repetir Fruta" />
    </form>

    <h3 id="result"></h3>
  </body>
</html>
