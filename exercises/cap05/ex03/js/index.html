<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Números Perfeitos</title>
  </head>
  <!--
    Enunciado do exercício:
    Elaborar um programa que leia um número e verifique se ele é ou não perfeito. Um número dito perfeito é aquele que é igual à soma dos seus divisores inteiros (exceto o próprio número). O programa deve exibir os divisores do número e a soma deles. A Figura 5.17 exibe a página do programa com um exemplo de número perfeito.
  -->
  <body>
    <h1>Programa Números Perfeitos</h1>

    <form>
      <label for="number">Número:</label>
      <input type="text" name="number" id="number" /> <br />

      <input type="submit" value="Verificar Se É Perfeito" />
    </form>

    <h3 id="result"></h3>
  </body>
</html>
