<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criação de Chinchilas</title>
  </head>
  <!--
    Enunciado do exercício:
    Digamos que o número de chinchilas de uma fazenda triplica a cada ano, após o primeiro ano. Elaborar um programa que leia o número inicial de chinchilas e anos e informe ano a ano o número médio previsto de chinchilas da fazenda. O número inicial de chinchilas deve ser maior ou igual a 2 (um casal).
  -->
  <body>
    <h1>Programa Criação de Chinchilas</h1>

    <form>
      <label for="chinchilas">Nº Chinchilas:</label>
      <input type="text" name="chinchilas" id="chinchilas" /> <br />

      <label for="years">Nº Anos:</label>
      <input type="text" name="years" id="years" /> <br />

      <input type="submit" value="Mostrar Previsão de Chinchilas" />
    </form>

    <pre></pre>

    <script>
      const form = document.querySelector("form");
      const result = document.querySelector("pre");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        let chinchilas = Number(form.chinchilas.value);
        const years = Number(form.years.value);

        if (isNaN(chinchilas) || chinchilas < 2) {
          return alert("O número mínimo de chinchilas é 2 (um casal).");
        }

        if (isNaN(years) || years < 1) {
          return alert("Informe um número de anos válido.");
        }

        let response = "";
        for (let i = 1; i <= years; i++) {
          response += `${i}º Ano: ${chinchilas} Chinchilas\n`;

          chinchilas *= 3;
        }

        result.innerText = response;
      });
    </script>
  </body>
</html>
