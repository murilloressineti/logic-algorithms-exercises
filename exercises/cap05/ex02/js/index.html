<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criação de Chinchilas</title>
  </head>
  <!--
    Enunciado do exercício:
    Digamos que o número de chinchilas de uma fazenda triplica a cada ano, após o primeiro ano. Elaborar um programa que leia o número inicial de chinchilas e anos e informe ano a ano o número médio previsto de chinchilas da fazenda. O número inicial de chinchilas deve ser maior ou igual a 2 (um casal). A Figura 5.16 exibe a página com um exemplo de saída do programa.
  -->
  <body>
    <h1>Programa Criação de Chinchilas</h1>

    <form>
      <label for="chinchilas">Nº Chinchilas:</label>
      <input type="text" name="chinchilas" id="chinchilas" /> <br />

      <label for="years">Nº Anos:</label>
      <input type="text" name="years" id="years" /> <br />

      <input type="submit" value="Mostrar Previsão de Chinchilas" />
    </form>
  </body>
</html>
