<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de Média</title>

    <style type="text/tailwindcss">
      @theme {
        --color-average-bg: #a5d2cb;

        --color-button-primary: #3b79c7;
        --color-button-hover: #2961a5;

        --color-average-green-text: #348445;
        --color-average-red-text: #cc141d;
      }
    </style>
  </head>
  <!--
    Enunciado do exercício:
    Elaborar um programa que leia 2 notas de um aluno em uma disciplina. Calcule e informe a média das notas.
    Exemplo:
    1ª Nota: 7.0
    2ª Nota: 8.0
    Média: 7.5
  -->
  <body>
    <div id="root">
      <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <script type="text/babel">
        function Header() {
          return (
            <div className="flex items-center justify-center flex-col px-4 pt-4">
              <span className="text-5xl mb-2">🎓</span>
              <h1 className="text-2xl font-bold">Calculadora de Média</h1>
            </div>
          );
        }

        function Calculator() {
          const [inFirstNote, setInFirstNote] = React.useState("");
          const [inSecondNote, setInSecondNote] = React.useState("");
          const [resultAverage, setResultAverage] = React.useState("");
          const [showResults, setShowResults] = React.useState(false);

          function convertToNumber(value) {
            value = value.trim();
            value = value.replace(",", ".");
            return Number(value);
          }

          function format(value) {
            return value.toFixed(2).replace(".", ",");
          }

          function handleSubmit(e) {
            e.preventDefault();

            const firstNote = convertToNumber(inFirstNote);
            const secondNote = convertToNumber(inSecondNote);

            if (isNaN(firstNote) || isNaN(secondNote)) {
              alert("Digite um valor válido.");
              return;
            }

            if (firstNote < 0 || secondNote < 0) {
              alert("A nota não pode ser negativa.");
              return;
            }

            if (firstNote > 10 || secondNote > 10) {
              alert("O limite da nota é 10.");
              return;
            }

            const average = (firstNote + secondNote) / 2;

            setResultAverage(average);
            setShowResults(true);
          }

          return (
            <div className="p-6">
              <form onSubmit={handleSubmit}>
                <div className="flex flex-col">
                  <label htmlFor="firstNote">1ª Nota:</label>
                  <input
                    type="text"
                    name="firstNote"
                    id="firstNote"
                    placeholder="Ex: 7,0"
                    className="border border-gray-400 rounded-md shadow-md p-1.5 mt-1.5 mb-4 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                    value={inFirstNote}
                    onChange={(e) => {
                      setInFirstNote(e.target.value);
                    }}
                  />

                  <label htmlFor="secondNote">2ª Nota:</label>
                  <input
                    type="text"
                    name="secondNote"
                    id="secondNote"
                    placeholder="Ex: 8,0"
                    className="border border-gray-400 rounded-md shadow-md p-1.5 mt-1.5 mb-4 focus:border-blue-500 focus:ring-2 focus:ring-blue-300 focus:outline-none"
                    value={inSecondNote}
                    onChange={(e) => {
                      setInSecondNote(e.target.value);
                    }}
                  />

                  <input
                    type="submit"
                    value="Calcular Média"
                    className="bg-button-primary text-white rounded-md p-2 cursor-pointer hover:bg-button-hover transition-all duration-300 font-semibold"
                  />
                </div>
              </form>

              {showResults && (
                <div
                  id="result"
                  className={`mt-6 text-center font-bold text-2xl ${
                    resultAverage >= 7
                      ? "text-average-green-text"
                      : "text-average-red-text"
                  }`}
                >
                  <div className="border-t my-4 border-gray-300"></div>
                  Média: {format(resultAverage)}
                </div>
              )}
            </div>
          );
        }

        function App() {
          return (
            <main className="min-h-screen bg-average-bg flex items-center justify-center">
              <div className="bg-white rounded-lg shadow-lg w-96 max-w-md">
                <Header />
                <Calculator />
              </div>
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      </script>
    </div>
  </body>
</html>
