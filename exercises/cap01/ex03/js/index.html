<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Loja</title>
  </head>
  <!--
    Enunciado do exercício:
    Elaborar um programa para uma loja, o qual leia o preço de um produto e informe as opções de pagamento da loja. Calcule e informe o valor para pagamento à vista com 10% de desconto e o valor em 3x.
    Exemplo:
    Preço: R$ 60.00
    À vista R$ 54,00
    Ou 3x de R$ 20,00
  -->
  <body>
    <h1>Loja</h1>
    <form>
      <label for="inPrice">Preço</label>
      <input type="text" name="inPrice" id="inPrice" placeholder="R$" />

      <input type="submit" value="Calcular" />
    </form>

    <h3 id="result"></h3>

    <script>
      const form = document.querySelector("form");
      const result = document.getElementById("result");

      function convertToNumber(value) {
        value = value.trim();

        value = value.replace(",", ".");

        return Number(value);
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const price = convertToNumber(form.inPrice.value);

        if (isNaN(price) || price <= 0) {
          alert("Digite um valor válido");
          return;
        }

        const payFull = price - price * 0.1;
        const payInstallment = price / 3;

        function formatBR(price) {
          return price.toFixed(2).replace(".", ",");
        }

        result.innerText = `
          Preço: R$ ${formatBR(price)}
          À vista R$ ${formatBR(payFull)}
          Ou 3x de R$ ${formatBR(payInstallment)}`;
      });
    </script>
  </body>
</html>
