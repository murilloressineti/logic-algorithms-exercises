<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--
    Enunciado do exercício:
    Elaborar um programa que leia um número.
    Calcule e informe os seus vizinhos: número anterior e número posterior.

    Exemplo:
    Número: 15
    Vizinhos: 14 e 16
  -->

    <h1>PROGRAMA VIZINHOS</h1>

    <form>
      <label for="number">Número:</label>
      <input type="number" id="number" />

      <input type="submit" value="Calcular" />
    </form>

    <h3 id="result"></h3>

    <script>
      const form = document.querySelector("form");
      const result = document.querySelector("h3");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const n = Number(form.number.value);

        const prevNeighbor = n - 1;
        const nextNeighbor = n + 1;

        result.innerText = `Vizinhos: ${prevNeighbor} e ${nextNeighbor}`;
      });
    </script>
  </body>
</html>
