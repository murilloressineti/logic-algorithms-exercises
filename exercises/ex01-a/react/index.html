<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa Vizinhos</title>
  </head>
  <body>
    <!--
    Enunciado do exercício:
    Elaborar um programa que leia um número.
    Calcule e informe os seus vizinhos: número anterior e número posterior.

    Exemplo:
    Número: 15
    Vizinhos: 14 e 16
  -->
    <div id="root">
      <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

      <script type="text/babel">
        function Title() {
          return (
            <h1 className="text-2xl font-bold text-center text-blue-900">
              PROGRAMA VIZINHOS
            </h1>
          );
        }

        function Input() {
          function handleSubmit(e) {
            e.preventDefault();
          }

          return (
            <form onSubmit={handleSubmit}>
              <div className="mt-8 flex items-center justify-center gap-2">
                <label htmlFor="number" className="text-blue-900 font-bold">
                  Número:
                </label>
                <input
                  type="number"
                  name="number"
                  id="number"
                  className="border border-gray-300 rounded p-2 hover:border-blue-900 focus:border-blue-500"
                  placeholder="15"
                />
              </div>

              <button
                type="submit"
                className="bg-gray-300 mt-6 w-full flex items-center justify-center gap-2 py-2 rounded-lg shadow-md hover:bg-gray-400 transition-all duration-300 cursor-pointer"
              >
                ▶️ Calcular
              </button>
            </form>
          );
        }

        function Result() {
          return <div></div>;
        }

        function App() {
          return (
            <main className="min-h-screen bg-slate-100 flex items-center justify-center">
              <div className="bg-white p-8 rounded-lg shadow-lg w-96 max-w-md">
                <Title />
                <Input />
              </div>
            </main>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      </script>
    </div>
  </body>
</html>
